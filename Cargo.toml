[package]
name = "cmppprotocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "CMPP 2.0 client protocol library"
license = "MIT"
readme = "README.md"
keywords = ["cmpp", "sms", "protocol", "tokio", "codec"]
categories = ["network-programming", "asynchronous"]

[dependencies]
bytes = "1.12"
chrono = "0.4"
encoding_rs = "0.8"
log = "0.4"
md-5 = "0.11"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
